name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web directory
        run: |
          rm -rf www
          mkdir -p www/icons
          cp index.html manifest.webmanifest sw.js fix.js www/
          cp icons/*.png www/icons/

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Include billing fixes in Android bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/public/index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="fix.js"></script>'
          if marker not in text:
              text = text.replace('</body>', f'{marker}</body>')
              p.write_text(text, encoding='utf-8')
          print('Android bundle patched:', p)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sri-krishna-builders-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
